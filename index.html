<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<title>楊梅高中分機覽表</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bubbles" aria-hidden="true"></div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo ring" aria-hidden="true">☎️</span>
      <div>
        <h1 data-i18n="title">楊梅高中分機覽表</h1>
        <p class="sub" data-i18n="subtitle">桃園市立楊梅高級中學</p>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="設定" data-i18n-aria="settings">⚙️</button>
  </header>

  <main id="main">
    <!-- 首頁 -->
    <section class="view" id="view-home">
      <div class="hero card">
        <svg class="hero-art" viewBox="0 0 360 170" role="img" aria-label="校園插圖">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e3f6ff"/></linearGradient>
          </defs>
          <rect width="360" height="170" rx="18" fill="url(#sky)"/>
          <circle class="sun" cx="300" cy="38" r="20" fill="#ffd43b"/>
          <g class="cloud"><ellipse cx="70" cy="36" rx="26" ry="11" fill="#fff"/><ellipse cx="92" cy="30" rx="18" ry="11" fill="#fff"/></g>
          <g class="cloud c2"><ellipse cx="200" cy="26" rx="20" ry="8" fill="#fff"/><ellipse cx="216" cy="22" rx="13" ry="8" fill="#fff"/></g>
          <rect x="0" y="140" width="360" height="30" fill="#8ce99a"/>
          <!-- 主建築 -->
          <rect x="95" y="70" width="170" height="72" fill="#ffa8a8"/>
          <polygon points="85,72 180,40 275,72" fill="#fa5252"/>
          <rect x="165" y="100" width="30" height="42" fill="#845ef7"/>
          <g fill="#fff">
            <rect x="108" y="82" width="16" height="14" rx="2"/><rect x="132" y="82" width="16" height="14" rx="2"/>
            <rect x="212" y="82" width="16" height="14" rx="2"/><rect x="236" y="82" width="16" height="14" rx="2"/>
            <rect x="108" y="110" width="16" height="14" rx="2"/><rect x="132" y="110" width="16" height="14" rx="2"/>
            <rect x="212" y="110" width="16" height="14" rx="2"/><rect x="236" y="110" width="16" height="14" rx="2"/>
          </g>
          <circle cx="180" cy="60" r="9" fill="#fff"/><path d="M180 54v6l4 3" stroke="#fa5252" stroke-width="2" fill="none"/>
          <!-- 樹 -->
          <circle cx="45" cy="118" r="22" fill="#40c057"/><rect x="42" y="130" width="6" height="14" fill="#a0522d"/>
          <circle cx="318" cy="120" r="18" fill="#51cf66"/><rect x="315" y="130" width="6" height="14" fill="#a0522d"/>
          <!-- 電話訊號 -->
          <g class="signal" fill="none" stroke="#ff922b" stroke-width="4" stroke-linecap="round">
            <path d="M292 92a10 10 0 0 1 0 14"/><path d="M300 86a20 20 0 0 1 0 26"/><path d="M308 80a30 30 0 0 1 0 38"/>
          </g>
          <text x="266" y="108" font-size="26">📞</text>
        </svg>
        <div class="hero-text">
          <h2 data-i18n="heroTitle">一指找到分機</h2>
          <p data-i18n="heroDesc">點選任何號碼即可撥打、複製或加入常用。</p>
        </div>
      </div>

      <div class="card mainlines">
        <h3 class="sec-title"><span>📡</span><span data-i18n="mainLines">總機</span></h3>
        <div id="lineList" class="line-list"></div>
        <p class="hint" data-i18n="dialHint">撥打分機：先撥總機，聽到語音後再輸入 4 碼分機。</p>
      </div>

      <div class="stats" id="stats"></div>

      <div class="card">
        <h3 class="sec-title"><span>🧭</span><span data-i18n="byCat">依類別瀏覽</span></h3>
        <div id="catTiles" class="cat-tiles"></div>
      </div>

      <div class="card">
        <h3 class="sec-title"><span>⚡</span><span data-i18n="quick">熱門快撥</span></h3>
        <div id="quickList" class="chip-row"></div>
      </div>

      <p class="foot" id="footInfo"></p>
    </section>

    <!-- 瀏覽 -->
    <section class="view" id="view-browse" hidden>
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-mode="unit" data-i18n="modeUnit">依單位</button>
        <button class="seg-btn" data-mode="map" data-i18n="modeMap">號碼地圖</button>
      </div>
      <div id="catFilter" class="chip-row filter"></div>
      <div id="unitList"></div>
      <div id="numMap" hidden></div>
    </section>

    <!-- 檢索 -->
    <section class="view" id="view-search" hidden>
      <div class="search-box card">
        <span class="s-ico">🔍</span>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="輸入單位、職稱、姓氏或分機">
        <button class="icon-btn small" id="btnVoice" aria-label="語音搜尋" data-i18n-aria="voice">🎤</button>
        <button class="icon-btn small" id="btnPad" aria-label="數字鍵盤" data-i18n-aria="keypad">🔢</button>
      </div>
      <div id="pad" class="pad card" hidden></div>
      <div id="suggest" class="chip-row"></div>
      <p id="resultInfo" class="result-info"></p>
      <div id="results" class="results"></div>
    </section>

    <!-- 常用 -->
    <section class="view" id="view-fav" hidden>
      <div class="card">
        <h3 class="sec-title"><span>⭐</span><span data-i18n="favs">我的常用</span></h3>
        <div id="favList" class="results"></div>
      </div>
      <div class="card">
        <h3 class="sec-title"><span>🕘</span><span data-i18n="recent">最近查看</span></h3>
        <div id="recentList" class="results"></div>
        <button class="btn ghost" id="btnClearRecent" data-i18n="clearRecent">清除紀錄</button>
      </div>
    </section>

    <!-- 挑戰 -->
    <section class="view" id="view-quiz" hidden>
      <div class="card quiz-start" id="quizStart">
        <div class="trophy bounce">🏆</div>
        <h2 data-i18n="quizTitle">分機小達人挑戰</h2>
        <p data-i18n="quizDesc">10 題隨機題目，看看你對學校分機有多熟！</p>
        <p class="best" id="bestScore"></p>
        <button class="btn primary big" id="btnQuizGo" data-i18n="start">開始挑戰</button>
      </div>
      <div class="card" id="quizBox" hidden>
        <div class="quiz-top"><span id="qNo"></span><span id="qScore"></span></div>
        <div class="progress"><i id="qBar"></i></div>
        <h3 id="qText" class="q-text"></h3>
        <div id="qOpts" class="q-opts"></div>
        <button class="btn primary" id="btnNext" hidden data-i18n="next">下一題 ➜</button>
      </div>
      <div class="card quiz-end" id="quizEnd" hidden>
        <div class="trophy" id="endEmoji">🎉</div>
        <h2 id="endText"></h2>
        <p id="endSub"></p>
        <button class="btn primary big" id="btnQuizAgain" data-i18n="again">再玩一次</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-view="home" class="active"><span>🏠</span><b data-i18n="navHome">首頁</b></button>
    <button data-view="browse"><span>📒</span><b data-i18n="navBrowse">瀏覽</b></button>
    <button data-view="search"><span>🔍</span><b data-i18n="navSearch">檢索</b></button>
    <button data-view="fav"><span>⭐</span><b data-i18n="navFav">常用</b></button>
    <button data-view="quiz"><span>🏆</span><b data-i18n="navQuiz">挑戰</b></button>
  </nav>
</div>

<!-- 詳細資料面板 -->
<div class="sheet-mask" id="sheetMask" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>

<!-- 設定 -->
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true">
  <div class="drawer-head">
    <h3 data-i18n="settings">設定</h3>
    <button class="icon-btn" id="btnCloseSettings" aria-label="關閉">✖️</button>
  </div>
  <div id="settingsBody"></div>
</div>

<div class="toast" id="toast" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
